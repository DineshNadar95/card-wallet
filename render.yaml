# Render Blueprint. Secrets use `sync: false`: set them in the Render dashboard, never here.
# API on the free plan (sleeps when idle). Cron jobs have no free plan: smallest paid instance.
services:
- type: web
  name: card-wallet-api
  plan: free
  region: virginia
  runtime: python
  rootDir: backend
  buildCommand: pip install uv && uv sync --frozen --no-dev
  startCommand: uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
  healthCheckPath: /health
  envVars:
  - key: PYTHON_VERSION
    value: '3.12'
  - key: DATABASE_URL
    sync: false
  - key: SUPABASE_URL
    sync: false
  - key: SUPABASE_JWT_SECRET
    sync: false
  - key: CORS_ORIGINS
    sync: false
  - key: ANTHROPIC_API_KEY
    sync: false
  - key: ANTHROPIC_MODEL
    value: claude-opus-5-5
  - key: SMTP_HOST
    sync: false
  - key: SMTP_PORT
    value: '587'
  - key: SMTP_USER
    sync: false
  - key: SMTP_PASSWORD
    sync: false
  - key: EMAIL_FROM
    sync: false
  - key: WEB_APP_URL
    sync: false
  - key: EXPO_ACCESS_TOKEN
    sync: false
- type: cron
  name: card-wallet-reminders
  plan: 0.5c-512mb
  region: virginia
  runtime: python
  rootDir: backend
  schedule: 0 14 * * *
  buildCommand: pip install uv && uv sync --frozen --no-dev
  startCommand: uv run python -m app.jobs.reminders
  envVars:
  - key: PYTHON_VERSION
    value: '3.12'
  - key: DATABASE_URL
    sync: false
  - key: SUPABASE_URL
    sync: false
  - key: SUPABASE_JWT_SECRET
    sync: false
  - key: ANTHROPIC_API_KEY
    sync: false
  - key: ANTHROPIC_MODEL
    value: claude-opus-5-5
  - key: SMTP_HOST
    sync: false
  - key: SMTP_PORT
    value: '587'
  - key: SMTP_USER
    sync: false
  - key: SMTP_PASSWORD
    sync: false
  - key: EMAIL_FROM
    sync: false
  - key: WEB_APP_URL
    sync: false
  - key: EXPO_ACCESS_TOKEN
    sync: false
- type: cron
  name: card-wallet-scraper
  plan: 0.5c-512mb
  region: virginia
  runtime: docker
  dockerfilePath: ./scraper/Dockerfile
  dockerContext: .
  schedule: 0 9 * * 0
  envVars:
  - key: DATABASE_URL
    sync: false
  - key: ANTHROPIC_API_KEY
    sync: false
  - key: ANTHROPIC_MODEL
    value: claude-opus-5-5
  - key: OWNER_EMAIL
    sync: false
  - key: SCRAPER_MIN_DELAY
    value: '10'
  - key: SMTP_HOST
    sync: false
  - key: SMTP_PORT
    value: '587'
  - key: SMTP_USER
    sync: false
  - key: SMTP_PASSWORD
    sync: false
  - key: EMAIL_FROM
    sync: false
