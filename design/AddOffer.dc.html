<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card Wallet · Add offer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6E73}a:hover{color:#084F53}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F7; color: #14181F; font-family: 'IBM Plex Sans', 'Helvetica Neue', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="background: #FFFFFF; border-bottom: 1px solid #DDE1E7; padding: 10px 8px 10px 16px; display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-size: 18px; font-weight: 700">Add an offer</h1>
<a href="Offers.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #14181F">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg></a>
</header>

<main style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px">

<div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #EEF0F3; border-radius: 10px; padding: 3px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<button type="button" role="tab" aria-selected="{{m.on}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
</sc-for>
</div>

<sc-if value="{{photo}}" hint-placeholder-val="{{ true }}">
<div style="background: #FFFFFF; border: 1px solid #DDE1E7; border-radius: 14px; padding: 12px; display: flex; gap: 12px; align-items: center">
<div style="flex: 0 0 64px; height: 96px; border-radius: 8px; background: repeating-linear-gradient(135deg, #E3E7EC 0 8px, #EEF0F3 8px 16px); display: flex; align-items: center; justify-content: center; font-size: 10px; color: #4A5361">[shot]</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<div style="font-weight: 600; font-size: 14px">Read 5 details from your screenshot</div>
<div style="font-size: 13px; color: #4A5361; line-height: 1.45">Check them below before saving — photos can be misread.</div>
<button type="button" style="align-self: flex-start; min-height: 36px; padding: 0; border: 0; background: transparent; color: {{accent}}; font: 600 13px 'IBM Plex Sans', system-ui, sans-serif">Retake or choose another</button>
</div>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="card" style="font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center">Card <span style="font-weight: 400; color: #4A5361">(optional)</span></label>
<select id="card" style="min-height: 46px; box-sizing: border-box; width: 100%; border: 1px solid #C3C9D2; border-radius: 10px; padding: 0 12px; background: #FFFFFF; font: 400 16px 'IBM Plex Sans', system-ui, sans-serif; color: #14181F"><option>No card — store coupon</option><option>[Card A] •••• 1234</option><option>[Card B] •••• 5678</option><option>[Card D] •••• 3456</option></select>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="merchant" style="font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center">Merchant or store<sc-if value="{{photo}}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; font-weight: 600; color: #084F53; background: #E6F1F1; padding: 2px 7px; border-radius: 6px">From screenshot</span></sc-if></label>
<input id="merchant" type="text" value="[Merchant 1]" style="min-height: 46px; box-sizing: border-box; width: 100%; border: 1px solid #C3C9D2; border-radius: 10px; padding: 0 12px; background: #FFFFFF; font: 400 16px 'IBM Plex Sans', system-ui, sans-serif; color: #14181F">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center">Offer type</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button type="button" aria-pressed="true" style="min-height: 44px; border-radius: 10px; border: 2px solid {{accent}}; background: #E6F1F1; color: #084F53; font: 600 14px 'IBM Plex Sans', system-ui, sans-serif">% back</button>
<button type="button" style="min-height: 44px; border-radius: 10px; border: 1px solid #DDE1E7; background: #FFFFFF; color: #14181F; font: 500 14px 'IBM Plex Sans', system-ui, sans-serif">$ off</button>
<button type="button" style="min-height: 44px; border-radius: 10px; border: 1px solid #DDE1E7; background: #FFFFFF; color: #14181F; font: 500 14px 'IBM Plex Sans', system-ui, sans-serif">Points</button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="amt" style="font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center">Value<sc-if value="{{photo}}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; font-weight: 600; color: #084F53; background: #E6F1F1; padding: 2px 7px; border-radius: 6px">From screenshot</span></sc-if></label>
<input id="amt" type="text" value="10%" style="min-height: 46px; box-sizing: border-box; width: 100%; border: 1px solid #C3C9D2; border-radius: 10px; padding: 0 12px; background: #FFFFFF; font: 400 16px 'IBM Plex Sans', system-ui, sans-serif; color: #14181F">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="cap" style="font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center">Max back<sc-if value="{{photo}}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; font-weight: 600; color: #084F53; background: #E6F1F1; padding: 2px 7px; border-radius: 6px">From screenshot</span></sc-if></label>
<input id="cap" type="text" value="$15" style="min-height: 46px; box-sizing: border-box; width: 100%; border: 1px solid #C3C9D2; border-radius: 10px; padding: 0 12px; background: #FFFFFF; font: 400 16px 'IBM Plex Sans', system-ui, sans-serif; color: #14181F">
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="min" style="font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center">Min spend<sc-if value="{{photo}}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; font-weight: 600; color: #084F53; background: #E6F1F1; padding: 2px 7px; border-radius: 6px">From screenshot</span></sc-if></label>
<input id="min" type="text" value="$50" style="min-height: 46px; box-sizing: border-box; width: 100%; border: 1px solid #C3C9D2; border-radius: 10px; padding: 0 12px; background: #FFFFFF; font: 400 16px 'IBM Plex Sans', system-ui, sans-serif; color: #14181F">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="exp" style="font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center">Expires<sc-if value="{{photo}}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; font-weight: 600; color: #084F53; background: #E6F1F1; padding: 2px 7px; border-radius: 6px">From screenshot</span></sc-if></label>
<input id="exp" type="text" value="[date]" style="min-height: 46px; box-sizing: border-box; width: 100%; border: 1px solid #C3C9D2; border-radius: 10px; padding: 0 12px; background: #FFFFFF; font: 400 16px 'IBM Plex Sans', system-ui, sans-serif; color: #14181F">
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #EEF0F3; padding-top: 14px">
<span style="font-size: 13px; font-weight: 600">Remind me before it ends</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<button type="button" style="min-height: 44px; border-radius: 10px; border: 1px solid #DDE1E7; background: #FFFFFF; color: #14181F; font: 500 14px 'IBM Plex Sans', system-ui, sans-serif">Off</button>
<button type="button" aria-pressed="true" style="min-height: 44px; border-radius: 10px; border: 2px solid {{accent}}; background: #E6F1F1; color: #084F53; font: 600 14px 'IBM Plex Sans', system-ui, sans-serif">3 days</button>
<button type="button" style="min-height: 44px; border-radius: 10px; border: 1px solid #DDE1E7; background: #FFFFFF; color: #14181F; font: 500 14px 'IBM Plex Sans', system-ui, sans-serif">5 days</button>
<button type="button" style="min-height: 44px; border-radius: 10px; border: 1px solid #DDE1E7; background: #FFFFFF; color: #14181F; font: 500 14px 'IBM Plex Sans', system-ui, sans-serif">1 week</button>
</div>
</div>
</main>

<div style="background: #FFFFFF; border-top: 1px solid #DDE1E7; padding: 12px 16px 28px">
<a href="Offers.dc.html" style="min-height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none">Save offer</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B6E73","options":["#0B6E73","#1F4FA3","#14181F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { mode: 'photo' }; }
renderVals() {
const accent = this.props.accent ?? '#0B6E73';
const modes = [['photo','From a photo'],['type','Type it in']].map(([k, label]) => {
const on = k === this.state.mode;
return { label, on, pick: () => this.setState({ mode: k }), style: 'min-height: 40px; border: 0; border-radius: 8px; cursor: pointer; font: ' + (on ? 600 : 500) + " 14px 'IBM Plex Sans', system-ui, sans-serif; background: " + (on ? '#FFFFFF' : 'transparent') + '; color: ' + (on ? '#14181F' : '#4A5361') + '; box-shadow: ' + (on ? '0 1px 2px rgba(20,24,31,0.12)' : 'none') + ';' };
});
return { accent, modes, photo: this.state.mode === 'photo' };
}
}
</script>
</body>
</html>
