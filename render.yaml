# Render Blueprint: the API only, on the free plan (no payment card needed; sleeps when idle).
# Secrets use `sync: false`: set them in the Render dashboard, never here.
# Scheduled jobs (reminders, weekly scraper) run on GitHub Actions: .github/workflows/.
services:
- type: web
  name: card-wallet-api
  plan: free
  region: virginia
  runtime: python
  rootDir: backend
  buildCommand: pip install uv && uv sync --frozen --no-dev
  startCommand: uv run --no-dev alembic upgrade head && uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
  healthCheckPath: /health
  envVars:
  - key: PYTHON_VERSION
    value: '3.12'
  - key: DATABASE_URL
    sync: false
  - key: SUPABASE_URL
    sync: false
  - key: SUPABASE_JWT_SECRET
    sync: false
  - key: CORS_ORIGINS
    sync: false
  - key: ANTHROPIC_API_KEY
    sync: false
  - key: ANTHROPIC_MODEL
    value: claude-opus-5-5
